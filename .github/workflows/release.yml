name: Build and Release VuNMix

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v1.2.0 or 1.2.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          TAG=""
          IS_RELEASE="false"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${INPUT_VERSION}"
            [[ "${TAG}" == v* ]] || TAG="v${TAG}"
            IS_RELEASE="true"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            IS_RELEASE="true"
          fi

          if [[ "${IS_RELEASE}" == "true" ]]; then
            if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Invalid release version '${TAG}'."
              echo "::error::Use vMAJOR.MINOR.PATCH, e.g. v1.2.0"
              exit 1
            fi
            VERSION="${TAG#v}"
          else
            VERSION="ci-${GITHUB_SHA::7}"
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "is_release=${IS_RELEASE}" >> "${GITHUB_OUTPUT}"

          echo "VERSION=${VERSION}"
          echo "TAG=${TAG:-<none>}"
          echo "IS_RELEASE=${IS_RELEASE}"

  firmware:
    name: ESP32-S3 firmware
    runs-on: ubuntu-latest
    needs: [prepare]
    env:
      PIO_ENV: esp32-s3-devkitc1-n16r8
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install platformio

      - name: Build firmware
        shell: bash
        run: |
          set -euo pipefail
          echo "Environment: ${PIO_ENV}"
          echo "Release version: ${VERSION}"
          pio run -e "${PIO_ENV}"

      - name: Package firmware
        shell: bash
        run: |
          set -euo pipefail

          BUILD_DIR=".pio/build/${PIO_ENV}"
          APP_BIN="${BUILD_DIR}/firmware.bin"

          if [[ ! -f "${APP_BIN}" ]]; then
            echo "::error::Firmware application image not found: ${APP_BIN}"
            exit 1
          fi

          rm -rf release
          mkdir -p release/full

          cp "${APP_BIN}" "release/VuNMix-Firmware-${VERSION}.bin"

          find "${BUILD_DIR}" \
            -maxdepth 1 \
            -type f \
            -name "*.bin" \
            -exec cp {} release/full/ \;

          BIN_COUNT=$(find release/full -maxdepth 1 -type f -name "*.bin" | wc -l)
          if [[ "${BIN_COUNT}" -eq 0 ]]; then
            echo "::error::No firmware BIN files found."
            exit 1
          fi

          (
            cd release/full
            zip -9 "../VuNMix-Firmware-Full-${VERSION}.zip" ./*.bin
          )

          ls -lah release
          ls -lah release/full

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ needs.prepare.outputs.version }}
          path: |
            release/VuNMix-Firmware-${{ needs.prepare.outputs.version }}.bin
            release/VuNMix-Firmware-Full-${{ needs.prepare.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 14

  desktop:
    name: Windows desktop app
    runs-on: windows-latest
    needs: [prepare]
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: desktop/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements.txt
          python -m pip install pyinstaller

      - name: Run desktop unit tests
        shell: pwsh
        run: |
          python -m unittest discover `
            -s desktop/tests `
            -v

      - name: Build desktop app with PyInstaller
        working-directory: desktop
        shell: pwsh
        run: |
          if (Test-Path "dist") {
            Remove-Item "dist" -Recurse -Force
          }
          if (Test-Path "build_release") {
            Remove-Item "build_release" -Recurse -Force
          }

          python -m PyInstaller `
            --clean `
            --noconfirm `
            VuNMix.spec `
            --distpath dist `
            --workpath build_release

          if (!(Test-Path "dist\VuNMix\VuNMix.exe")) {
            throw "PyInstaller output not found: desktop\dist\VuNMix\VuNMix.exe"
          }

          Get-ChildItem "dist\VuNMix"

      - name: Verify packaged esptool ESP32-S3 data
        working-directory: desktop
        shell: pwsh
        run: |
          python tools/verify_packaged_esptool.py "dist\VuNMix"

      - name: Package portable app
        working-directory: desktop
        shell: pwsh
        run: |
          if (Test-Path "dist_packages") {
            Remove-Item "dist_packages" -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path "dist_packages" | Out-Null

          $zip = "dist_packages\VuNMix-Windows-Portable-$env:VERSION.zip"
          Compress-Archive `
            -Path "dist\VuNMix\*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal `
            -Force

          if (!(Test-Path $zip)) {
            throw "Portable ZIP was not created."
          }

          Get-Item $zip | Format-List FullName, Length

      - name: Build Inno Setup installer
        working-directory: desktop
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (!(Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }

          if (!(Test-Path $iscc)) {
            throw "ISCC.exe was not found."
          }

          if (Test-Path "dist_installer") {
            Remove-Item "dist_installer" -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path "dist_installer" | Out-Null

          $outputDir = (Resolve-Path "dist_installer").Path
          & $iscc `
            "/O$outputDir" `
            "/FVuNMix-Windows-Setup-$env:VERSION" `
            "VuNMix_Installer.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

          $installer = "dist_installer\VuNMix-Windows-Setup-$env:VERSION.exe"
          if (!(Test-Path $installer)) {
            throw "Installer output not found: $installer"
          }

          Get-Item $installer | Format-List FullName, Length

      - name: Stage Windows release files
        shell: pwsh
        run: |
          if (Test-Path "desktop\release") {
            Remove-Item "desktop\release" -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path "desktop\release" | Out-Null

          Copy-Item `
            "desktop\dist_packages\VuNMix-Windows-Portable-$env:VERSION.zip" `
            "desktop\release\VuNMix-Windows-Portable-$env:VERSION.zip" `
            -Force

          Copy-Item `
            "desktop\dist_installer\VuNMix-Windows-Setup-$env:VERSION.exe" `
            "desktop\release\VuNMix-Windows-Setup-$env:VERSION.exe" `
            -Force

          Get-ChildItem "desktop\release" -File | Format-Table Name, Length

          $dirs = @(Get-ChildItem "desktop\release" -Directory)
          if ($dirs.Count -gt 0) {
            $dirs | Format-Table Name
            throw "Windows release staging directory contains unexpected directories."
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ needs.prepare.outputs.version }}
          path: |
            desktop/release/VuNMix-Windows-Portable-${{ needs.prepare.outputs.version }}.zip
            desktop/release/VuNMix-Windows-Setup-${{ needs.prepare.outputs.version }}.exe
          if-no-files-found: error
          retention-days: 14

  manifest:
    name: Release manifest
    runs-on: ubuntu-latest
    needs: [prepare, firmware, desktop]
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: manifest-input
          merge-multiple: true

      - name: Generate latest.json
        shell: bash
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          if [[ -z "${TAG}" ]]; then
            TAG="ci-${GITHUB_SHA::7}"
          fi

          rm -rf manifest-output
          mkdir -p manifest-output

          python desktop/tools/generate_release_manifest.py \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "${TAG}" \
            --version "${VERSION}" \
            --firmware "manifest-input/VuNMix-Firmware-${VERSION}.bin" \
            --windows-setup "manifest-input/VuNMix-Windows-Setup-${VERSION}.exe" \
            --windows-portable "manifest-input/VuNMix-Windows-Portable-${VERSION}.zip" \
            --minimum-desktop-version "v0.5.0" \
            --minimum-firmware-version "v0.5.0" \
            --output "manifest-output/latest.json"

          python -m json.tool manifest-output/latest.json >/dev/null
          test -s manifest-output/latest.json
          cat manifest-output/latest.json

      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ needs.prepare.outputs.version }}
          path: manifest-output/latest.json
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, firmware, desktop, manifest]
    if: needs.prepare.outputs.is_release == 'true'
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail

          find release-assets -maxdepth 2 -printf "%y %p\n" | sort

          test -f "release-assets/VuNMix-Firmware-${VERSION}.bin"
          test -f "release-assets/VuNMix-Firmware-Full-${VERSION}.zip"
          test -f "release-assets/VuNMix-Windows-Portable-${VERSION}.zip"
          test -f "release-assets/VuNMix-Windows-Setup-${VERSION}.exe"
          test -f "release-assets/latest.json"
          python -m json.tool release-assets/latest.json >/dev/null

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum \
            "VuNMix-Firmware-${VERSION}.bin" \
            "VuNMix-Firmware-Full-${VERSION}.zip" \
            "VuNMix-Windows-Portable-${VERSION}.zip" \
            "VuNMix-Windows-Setup-${VERSION}.exe" \
            "latest.json" \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update GitHub Release
        shell: bash
        run: |
          set -euo pipefail

          ASSETS=(
            "release-assets/VuNMix-Firmware-${VERSION}.bin"
            "release-assets/VuNMix-Firmware-Full-${VERSION}.zip"
            "release-assets/VuNMix-Windows-Portable-${VERSION}.zip"
            "release-assets/VuNMix-Windows-Setup-${VERSION}.exe"
            "release-assets/latest.json"
            "release-assets/SHA256SUMS.txt"
          )

          printf '  %s\n' "${ASSETS[@]}"

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload \
              "${TAG}" \
              "${ASSETS[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create \
              "${TAG}" \
              "${ASSETS[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "VuNMix ${TAG}" \
              --generate-notes
          fi

      - name: Verify published release
        shell: bash
        run: |
          set -euo pipefail
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}"
          rm -rf release-verify
          mkdir release-verify
          gh release download "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "latest.json" \
            --dir release-verify
          test -s release-verify/latest.json
          python -m json.tool release-verify/latest.json >/dev/null
