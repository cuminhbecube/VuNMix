name: Build and Release VuNMix

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v1.2.0 or 1.2.0"
        required: true
        type: string


permissions:
  contents: read


jobs:

  # ============================================================
  # PREPARE VERSION
  # ============================================================

  prepare:
    name: Prepare version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is_release: ${{ steps.version.outputs.is_release }}

    steps:

      - name: Resolve version
        id: version
        shell: bash

        env:
          INPUT_VERSION: ${{ inputs.version }}

        run: |
          set -euo pipefail

          TAG=""
          IS_RELEASE="false"

          # Manual workflow run
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then

            TAG="${INPUT_VERSION}"

            # Automatically add "v"
            [[ "${TAG}" == v* ]] || TAG="v${TAG}"

            IS_RELEASE="true"

          # Tag push
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then

            TAG="${GITHUB_REF_NAME}"
            IS_RELEASE="true"

          fi


          if [[ "${IS_RELEASE}" == "true" ]]; then

            # Validate semantic version
            if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then

              echo "::error::Invalid release version '${TAG}'."
              echo "::error::Use vMAJOR.MINOR.PATCH, e.g. v1.2.0"

              exit 1
            fi

            VERSION="${TAG#v}"

          else

            VERSION="ci-${GITHUB_SHA::7}"

          fi


          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "is_release=${IS_RELEASE}" >> "${GITHUB_OUTPUT}"


          echo "========================================="
          echo "VERSION=${VERSION}"
          echo "TAG=${TAG:-<none>}"
          echo "IS_RELEASE=${IS_RELEASE}"
          echo "========================================="


  # ============================================================
  # BUILD ESP32-S3 FIRMWARE
  # ============================================================

  firmware:
    name: ESP32-S3 firmware
    runs-on: ubuntu-latest

    needs:
      - prepare

    env:
      PIO_ENV: esp32-s3-devkitc1-n16r8
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"
          cache: "pip"


      - name: Cache PlatformIO
        uses: actions/cache@v4

        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms

          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}

          restore-keys: |
            ${{ runner.os }}-pio-


      - name: Install PlatformIO
        shell: bash

        run: |
          python -m pip install --upgrade pip
          python -m pip install platformio


      - name: Build firmware
        shell: bash

        run: |
          set -euo pipefail

          echo "Building firmware..."
          echo "Environment: ${PIO_ENV}"
          echo "Release version: ${VERSION}"

          pio run -e "${PIO_ENV}"


      - name: Package firmware
        shell: bash

        run: |
          set -euo pipefail

          BUILD_DIR=".pio/build/${PIO_ENV}"
          APP_BIN="${BUILD_DIR}/firmware.bin"

          echo "Build directory:"
          ls -lah "${BUILD_DIR}"

          if [[ ! -f "${APP_BIN}" ]]; then
            echo "::error::Firmware application image not found:"
            echo "::error::${APP_BIN}"
            exit 1
          fi


          # Always create a clean release directory.
          rm -rf release
          mkdir -p release/full


          # ------------------------------------------------------
          # Application firmware
          # Used by VuNMix Desktop firmware updater
          # ------------------------------------------------------

          cp \
            "${APP_BIN}" \
            "release/VuNMix-Firmware-${VERSION}.bin"


          # ------------------------------------------------------
          # Full firmware package
          # bootloader / partitions / firmware etc.
          # ------------------------------------------------------

          find "${BUILD_DIR}" \
            -maxdepth 1 \
            -type f \
            -name "*.bin" \
            -exec cp {} release/full/ \;


          BIN_COUNT=$(find release/full -maxdepth 1 -type f -name "*.bin" | wc -l)

          if [[ "${BIN_COUNT}" -eq 0 ]]; then
            echo "::error::No firmware BIN files found."
            exit 1
          fi


          (
            cd release/full

            zip -9 \
              "../VuNMix-Firmware-Full-${VERSION}.zip" \
              ./*.bin
          )


          echo ""
          echo "Firmware release assets:"
          ls -lah release

          echo ""
          echo "Full firmware package contents:"
          ls -lah release/full


      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4

        with:
          name: firmware-${{ needs.prepare.outputs.version }}

          path: |
            release/VuNMix-Firmware-${{ needs.prepare.outputs.version }}.bin
            release/VuNMix-Firmware-Full-${{ needs.prepare.outputs.version }}.zip

          if-no-files-found: error
          retention-days: 14


  # ============================================================
  # BUILD WINDOWS DESKTOP APP
  # ============================================================

  desktop:
    name: Windows desktop app
    runs-on: windows-latest

    needs:
      - prepare

    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: desktop/requirements.txt


      - name: Install dependencies
        shell: pwsh

        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements.txt
          python -m pip install pyinstaller


      - name: Run desktop unit tests
        shell: pwsh

        run: |
          python -m unittest discover `
            -s desktop/tests `
            -v


      # ========================================================
      # PYINSTALLER
      # ========================================================

      - name: Build desktop app with PyInstaller
        working-directory: desktop
        shell: pwsh

        run: |

          # Remove previous generated build folders.
          if (Test-Path "dist") {
            Remove-Item "dist" -Recurse -Force
          }

          if (Test-Path "build_release") {
            Remove-Item "build_release" -Recurse -Force
          }


          python -m PyInstaller `
            --clean `
            --noconfirm `
            VuNMix.spec `
            --distpath dist `
            --workpath build_release


          if (!(Test-Path "dist\VuNMix\VuNMix.exe")) {

            throw "PyInstaller output not found: desktop\dist\VuNMix\VuNMix.exe"

          }


          Write-Host ""
          Write-Host "PyInstaller output:"
          Get-ChildItem "dist\VuNMix"


      # ========================================================
      # PORTABLE ZIP
      # ========================================================

      - name: Package portable app
        working-directory: desktop
        shell: pwsh

        run: |

          if (Test-Path "dist_packages") {
            Remove-Item "dist_packages" -Recurse -Force
          }


          New-Item `
            -ItemType Directory `
            -Force `
            -Path "dist_packages" |
            Out-Null


          $zip = "dist_packages\VuNMix-Windows-Portable-$env:VERSION.zip"


          Compress-Archive `
            -Path "dist\VuNMix\*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal `
            -Force


          if (!(Test-Path $zip)) {
            throw "Portable ZIP was not created."
          }


          Write-Host ""
          Write-Host "Portable package:"

          Get-Item $zip |
            Format-List FullName, Length


      # ========================================================
      # WINDOWS INSTALLER
      # ========================================================

      - name: Build Inno Setup installer
        working-directory: desktop
        shell: pwsh

        run: |

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"


          if (!(Test-Path $iscc)) {

            Write-Host "Installing Inno Setup..."

            choco install innosetup `
              --no-progress `
              -y


            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          }


          if (!(Test-Path $iscc)) {

            throw "ISCC.exe was not found."

          }


          if (Test-Path "dist_installer") {

            Remove-Item `
              "dist_installer" `
              -Recurse `
              -Force

          }


          New-Item `
            -ItemType Directory `
            -Force `
            -Path "dist_installer" |
            Out-Null


          $outputDir = (Resolve-Path "dist_installer").Path


          & $iscc `
            "/O$outputDir" `
            "/FVuNMix-Windows-Setup-$env:VERSION" `
            "VuNMix_Installer.iss"


          if ($LASTEXITCODE -ne 0) {

            throw "Inno Setup failed with exit code $LASTEXITCODE"

          }


          $installer = "dist_installer\VuNMix-Windows-Setup-$env:VERSION.exe"


          if (!(Test-Path $installer)) {

            throw "Installer output not found: $installer"

          }


          Write-Host ""
          Write-Host "Installer package:"

          Get-Item $installer |
            Format-List FullName, Length


      # ========================================================
      # STAGE WINDOWS RELEASE
      #
      # IMPORTANT:
      # Delete the entire directory first.
      #
      # This prevents tracked files such as:
      #
      # desktop/release/_internal
      # desktop/release/VuNMix.exe
      #
      # from being included in GitHub release artifacts.
      # ========================================================

      - name: Stage Windows release files
        shell: pwsh

        run: |

          if (Test-Path "desktop\release") {

            Write-Host "Removing previous release directory..."

            Remove-Item `
              "desktop\release" `
              -Recurse `
              -Force

          }


          New-Item `
            -ItemType Directory `
            -Force `
            -Path "desktop\release" |
            Out-Null


          Copy-Item `
            "desktop\dist_packages\VuNMix-Windows-Portable-$env:VERSION.zip" `
            "desktop\release\VuNMix-Windows-Portable-$env:VERSION.zip" `
            -Force


          Copy-Item `
            "desktop\dist_installer\VuNMix-Windows-Setup-$env:VERSION.exe" `
            "desktop\release\VuNMix-Windows-Setup-$env:VERSION.exe" `
            -Force


          Write-Host ""
          Write-Host "Final Windows release directory:"


          Get-ChildItem `
            "desktop\release" `
            -File |
            Format-Table Name, Length


          # Ensure no unexpected directories exist.
          $dirs = Get-ChildItem `
            "desktop\release" `
            -Directory


          if ($dirs.Count -gt 0) {

            Write-Host "Unexpected directories found:"

            $dirs |
              Format-Table Name


            throw "Windows release staging directory contains unexpected directories."

          }


      # ========================================================
      # UPLOAD EXACT WINDOWS FILES
      #
      # DO NOT USE:
      #
      # desktop/release/*
      #
      # because it can include directories.
      # ========================================================

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4

        with:

          name: windows-${{ needs.prepare.outputs.version }}

          path: |
            desktop/release/VuNMix-Windows-Portable-${{ needs.prepare.outputs.version }}.zip
            desktop/release/VuNMix-Windows-Setup-${{ needs.prepare.outputs.version }}.exe

          if-no-files-found: error
          retention-days: 14


  # ============================================================
  # CREATE GITHUB RELEASE
  # ============================================================

  release:
    name: Publish GitHub Release

    runs-on: ubuntu-latest

    needs:
      - prepare
      - firmware
      - desktop


    # Only publish a GitHub Release for:
    #
    # workflow_dispatch
    # or
    # v* tags

    if: needs.prepare.outputs.is_release == 'true'


    permissions:
      contents: write


    env:

      GH_TOKEN: ${{ github.token }}

      TAG: ${{ needs.prepare.outputs.tag }}

      VERSION: ${{ needs.prepare.outputs.version }}


    steps:

      # ========================================================
      # DOWNLOAD ARTIFACTS
      # ========================================================

      - name: Download all build artifacts
        uses: actions/download-artifact@v4

        with:
          path: release-assets
          merge-multiple: true


      # ========================================================
      # VERIFY
      # ========================================================

      - name: Verify release assets
        shell: bash

        run: |
          set -euo pipefail


          echo ""
          echo "Downloaded release assets:"
          echo ""


          find release-assets \
            -maxdepth 2 \
            -printf "%y %p\n" \
            | sort


          test -f \
            "release-assets/VuNMix-Firmware-${VERSION}.bin"


          test -f \
            "release-assets/VuNMix-Firmware-Full-${VERSION}.zip"


          test -f \
            "release-assets/VuNMix-Windows-Portable-${VERSION}.zip"


          test -f \
            "release-assets/VuNMix-Windows-Setup-${VERSION}.exe"


          echo ""
          echo "All required release assets exist."


      # ========================================================
      # SHA256
      # ========================================================

      - name: Generate SHA-256 checksums
        shell: bash

        run: |
          set -euo pipefail


          cd release-assets


          sha256sum \
            "VuNMix-Firmware-${VERSION}.bin" \
            "VuNMix-Firmware-Full-${VERSION}.zip" \
            "VuNMix-Windows-Portable-${VERSION}.zip" \
            "VuNMix-Windows-Setup-${VERSION}.exe" \
            > SHA256SUMS.txt


          echo ""
          echo "SHA-256 checksums:"
          echo ""


          cat SHA256SUMS.txt


      # ========================================================
      # CREATE / UPDATE RELEASE
      #
      # DO NOT USE:
      #
      # release-assets/*
      #
      # Explicit file names prevent directories from being
      # passed to `gh release`.
      #
      # If the release already exists from a previously failed
      # run, upload assets with --clobber.
      # ========================================================

      - name: Create or update GitHub Release
        shell: bash

        run: |
          set -euo pipefail


          ASSETS=(

            "release-assets/VuNMix-Firmware-${VERSION}.bin"

            "release-assets/VuNMix-Firmware-Full-${VERSION}.zip"

            "release-assets/VuNMix-Windows-Portable-${VERSION}.zip"

            "release-assets/VuNMix-Windows-Setup-${VERSION}.exe"

            "release-assets/SHA256SUMS.txt"

          )


          echo ""
          echo "Release tag: ${TAG}"
          echo "Release version: ${VERSION}"

          echo ""
          echo "Release assets:"


          printf '  %s\n' "${ASSETS[@]}"


          # ----------------------------------------------------
          # Existing release
          # ----------------------------------------------------

          if gh release view \
            "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            >/dev/null 2>&1
          then

            echo ""
            echo "Release ${TAG} already exists."
            echo "Updating release assets..."


            gh release upload \
              "${TAG}" \
              "${ASSETS[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber


            echo ""
            echo "Release assets updated successfully."


          # ----------------------------------------------------
          # New release
          # ----------------------------------------------------

          else

            echo ""
            echo "Creating new release ${TAG}..."


            gh release create \
              "${TAG}" \
              "${ASSETS[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "VuNMix ${TAG}" \
              --generate-notes


            echo ""
            echo "Release created successfully."

          fi


      # ========================================================
      # FINAL CHECK
      # ========================================================

      - name: Verify published release
        shell: bash

        run: |
          set -euo pipefail

          echo ""
          echo "Published release:"
          echo ""

          gh release view \
            "${TAG}" \
            --repo "${GITHUB_REPOSITORY}"